<html lang="en">

<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --avocado-peel:   #003316;
    --freshly-mashed: #42A236;
    --zesty-lime:     #DCE58A;
    --bell-pepper:    #FFAC00;
    --salt:           #F3EDE3;
    --molcajete:      #A4AEAA;
    --garlic:         #E1D0B3;
    --diced-tomato:   #ED7C76;
    --blue-corn:      #81D1F4;
 
    --gamer-bg:     #071a0c;
    --gamer-border: #42A236;
    --gamer-head:   linear-gradient(135deg,#003316,#1a6e12);
    --gamer-avatar: #42A236;
 
    --chatty-bg:     #06141a;
    --chatty-border: #81D1F4;
    --chatty-head:   linear-gradient(135deg,#003316,#0e5a75);
    --chatty-avatar: #81D1F4;
 
    --mixed-bg:     #1a1200;
    --mixed-border: #FFAC00;
    --mixed-head:   linear-gradient(135deg,#003316,#7a5000);
    --mixed-avatar: #FFAC00;
 
    --bg:          #061009;
    --surface:     #0c1a0f;
    --border:      #163320;
    --person-bg:   #0f1f13;
    --person-hov:  #162a1a;
    --txt:         #F3EDE3;
    --muted:       #A4AEAA;
 
    --s-green:  #42A236;
    --s-yellow: #FFAC00;
    --s-red:    #ED7C76;
  }
 
  *{box-sizing:border-box;margin:0;padding:0;}
 
  body{
    background:var(--bg);
    font-family:'Outfit',sans-serif;
    color:var(--txt);
    min-height:100vh;
  }
 
  /* TOP BAR */
  .top-bar{
    background:var(--avocado-peel);
    border-bottom:1px solid #082210;
    padding:12px 24px;
    display:flex;
    align-items:center;
    gap:16px;
    position:sticky;top:0;z-index:100;
    box-shadow:0 2px 24px rgba(0,0,0,0.5);
  }
  .brand-name{
    font-size:1.3rem;font-weight:800;
    color:var(--zesty-lime);letter-spacing:0.08em;
  }
  .divider{width:1px;height:22px;background:rgba(220,229,138,0.18);}
  .page-title{font-size:0.9rem;font-weight:600;color:var(--garlic);}
 
  .top-right{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap;}
 
  .legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:0.73rem;font-weight:600;color:var(--garlic);opacity:.85;}
  .leg-dot{width:8px;height:8px;border-radius:50%;}
  .leg-sep{width:1px;height:18px;background:rgba(220,229,138,0.15);}
 
  .sz-legend{display:flex;gap:7px;}
  .sz-chip{display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:0.68rem;font-weight:700;}
  .sz-chip.g{background:rgba(66,162,54,.18);color:#6dd468;border:1px solid rgba(66,162,54,.3);}
  .sz-chip.y{background:rgba(255,172,0,.18);color:#ffc940;border:1px solid rgba(255,172,0,.3);}
  .sz-chip.r{background:rgba(237,124,118,.18);color:#f09090;border:1px solid rgba(237,124,118,.3);}
 
  .add-btn{
    display:flex;align-items:center;gap:6px;
    padding:7px 16px;border-radius:99px;
    background:var(--freshly-mashed);border:none;
    color:var(--avocado-peel);font-family:'Outfit',sans-serif;
    font-size:0.8rem;font-weight:700;cursor:pointer;
    transition:background .15s,transform .15s,box-shadow .15s;
    white-space:nowrap;
  }
  .add-btn:hover{background:var(--zesty-lime);transform:translateY(-1px);box-shadow:0 4px 14px rgba(66,162,54,.35);}
  .add-btn svg{width:13px;height:13px;}
 
  /* GRID */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(265px,1fr));
    gap:14px;padding:22px 24px;
  }
 
  /* CARD */
  .group-card{border-radius:11px;border:1.5px solid;overflow:hidden;transition:box-shadow .2s;}
  .type-gamer {border-color:var(--gamer-border);background:var(--gamer-bg);}
  .type-chatty{border-color:var(--chatty-border);background:var(--chatty-bg);}
  .type-mixed {border-color:var(--mixed-border); background:var(--mixed-bg);}
  .group-card.drag-over{box-shadow:0 0 0 2.5px var(--zesty-lime),0 0 18px rgba(220,229,138,.2);}
 
  .group-header{
    padding:10px 13px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .type-gamer  .group-header{background:var(--gamer-head);}
  .type-chatty .group-header{background:var(--chatty-head);}
  .type-mixed  .group-header{background:var(--mixed-head);}
 
  .g-num{font-size:1rem;font-weight:800;color:var(--zesty-lime);min-width:28px;}
  .g-pill{
    font-size:0.63rem;font-weight:700;padding:2px 7px;border-radius:99px;
    background:rgba(220,229,138,.14);color:var(--zesty-lime);
    text-transform:uppercase;letter-spacing:.06em;
    border:1px solid rgba(220,229,138,.22);
  }
  .g-count{
    margin-left:auto;display:flex;align-items:center;gap:4px;
    font-size:0.78rem;font-weight:700;color:var(--salt);
  }
  .sz-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .sz-dot.g{background:var(--s-green);box-shadow:0 0 5px var(--s-green);}
  .sz-dot.y{background:var(--s-yellow);box-shadow:0 0 5px var(--s-yellow);}
  .sz-dot.r{background:var(--s-red);box-shadow:0 0 5px var(--s-red);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 4px var(--s-red);}50%{box-shadow:0 0 12px var(--s-red);}}
 
  .people-area{
    padding:9px;min-height:56px;
    display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;
  }
 
  /* CHIP */
  .person-chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px 4px 5px;border-radius:7px;
    background:var(--person-bg);border:1px solid var(--border);
    font-size:0.74rem;font-weight:600;cursor:grab;user-select:none;
    transition:background .15s,transform .15s,box-shadow .15s;
    white-space:nowrap;color:var(--salt);
  }
  .person-chip:hover{
    background:var(--person-hov);transform:translateY(-1px);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
    border-color:rgba(220,229,138,.18);
  }
  .person-chip.dragging{opacity:.35;cursor:grabbing;}
  .p-avatar{
    width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.56rem;font-weight:800;flex-shrink:0;
    color:var(--avocado-peel);
  }
  .type-gamer  .p-avatar{background:var(--gamer-avatar);}
  .type-chatty .p-avatar{background:var(--chatty-avatar);}
  .type-mixed  .p-avatar{background:var(--mixed-avatar);}
  .chip-name{max-width:128px;overflow:hidden;text-overflow:ellipsis;}
 
  /* UNASSIGNED */
  .unassigned-section{
    margin:0 24px 30px;
    border:1.5px dashed rgba(164,174,170,.25);
    border-radius:11px;overflow:hidden;background:var(--surface);
  }
  .un-header{
    padding:9px 13px;display:flex;align-items:center;gap:9px;
    border-bottom:1px solid var(--border);background:rgba(0,51,22,.45);
  }
  .un-title{font-size:0.83rem;font-weight:700;color:var(--molcajete);}
  .un-count{font-size:0.73rem;color:var(--molcajete);opacity:.65;}
  .unassigned-section .people-area{min-height:44px;}
  .unassigned-section .p-avatar{background:var(--molcajete);}
 
  /* MODAL */
  .modal-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,16,6,.8);backdrop-filter:blur(8px);
    z-index:1000;align-items:center;justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#0a1f0e;border:1.5px solid #1a3d20;
    border-radius:15px;padding:26px;width:355px;max-width:95vw;
    box-shadow:0 24px 64px rgba(0,0,0,.65);animation:min .2s ease;
  }
  @keyframes min{from{opacity:0;transform:scale(.94) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}
 
  .modal h2{font-size:1.1rem;font-weight:800;color:var(--zesty-lime);margin-bottom:18px;}
 
  .m-field{margin-bottom:13px;}
  .m-field label{
    display:block;font-size:0.7rem;font-weight:700;color:var(--molcajete);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;
  }
  .m-field input,.m-field select{
    width:100%;padding:9px 11px;border-radius:8px;
    background:#0f2214;border:1.5px solid #1a3d20;
    color:var(--salt);font-family:'Outfit',sans-serif;
    font-size:0.86rem;font-weight:500;outline:none;
    transition:border-color .15s;appearance:none;
  }
  .m-field input:focus,.m-field select:focus{border-color:var(--freshly-mashed);}
  .m-field select option{background:#0f2214;}
  .m-field input::placeholder{color:var(--molcajete);opacity:.55;}
  .m-err{font-size:0.71rem;color:var(--diced-tomato);margin-top:4px;display:none;font-weight:600;}
  .m-err.show{display:block;}
 
  .m-actions{display:flex;gap:9px;margin-top:18px;}
  .m-actions button{
    flex:1;padding:9px;border-radius:8px;border:none;
    font-family:'Outfit',sans-serif;font-size:0.83rem;font-weight:700;
    cursor:pointer;transition:opacity .15s,transform .15s;
  }
  .m-actions button:hover{opacity:.86;transform:translateY(-1px);}
  .btn-c{background:#173320;color:var(--molcajete);}
  .btn-a{background:var(--freshly-mashed);color:var(--avocado-peel);}
 
  /* GHOST */
  #ghost{
    position:fixed;pointer-events:none;z-index:9999;
    padding:5px 12px;border-radius:8px;
    background:var(--avocado-peel);border:1px solid var(--zesty-lime);
    font-family:'Outfit',sans-serif;font-size:0.76rem;font-weight:600;
    color:var(--zesty-lime);transform:translate(-50%,-50%);display:none;
  }
</style>
</head>

<div class="top-bar">
  <span class="brand-name">AVICADO</span>
  <div class="divider"></div>
  <span class="page-title">Homiez Groups 🎉</span>
 
  <div class="top-right">
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#42A236"></div> Gamers 🎲</div>
      <div class="leg-item"><div class="leg-dot" style="background:#FFAC00"></div> Mixed ⚡</div>
      <div class="leg-item"><div class="leg-dot" style="background:#81D1F4"></div> Chatty 💬</div>
      <div class="leg-sep"></div>
      <div class="sz-legend">
        <div class="sz-chip g">● 1–4</div>
        <div class="sz-chip y">● 5–6</div>
        <div class="sz-chip r">● 7+</div>
      </div>
    </div>
    <button class="add-btn" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Member
    </button>
  </div>
</div>
 
<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="maybeClose(event)">
  <div class="modal">
    <h2>Add New Member</h2>
    <div class="m-field">
      <label>Full Name</label>
      <input type="text" id="inp-name" placeholder="e.g. Jane Smith"
             oninput="clearErr()" onkeydown="if(event.key==='Enter')submitModal()"/>
      <div class="m-err" id="m-err"></div>
    </div>
    <div class="m-field">
      <label>Assign to Group</label>
      <select id="inp-group"><option value="0">— Unassigned</option></select>
    </div>
    <div class="m-field">
      <label>Happy Hour Preference</label>
      <select id="inp-type">
        <option value="gamer">🎲 Gamers</option>
        <option value="mixed" selected>⚡ Mixed</option>
        <option value="chatty">💬 Chatty</option>
      </select>
    </div>
    <div class="m-actions">
      <button class="btn-c" onclick="closeModal()">Cancel</button>
      <button class="btn-a" onclick="submitModal()">Add Member</button>
    </div>
  </div>
</div>
 
<div class="grid" id="groups-grid"></div>
 
<div class="unassigned-section" id="unassigned-section">
  <div class="un-header">
    <span class="un-title">Unassigned</span>
    <span class="un-count" id="un-count"></span>
  </div>
  <div class="people-area" id="un-area" data-group="0"></div>
</div>
 
<div id="ghost"></div>

  {name:"Aleksandar Stojkov",group:30,type:"mixed"},{name:"Vicky Xie",group:30,type:"mixed"},
  {name:"Chelsea Agbon",group:30,type:"mixed"},{name:"Demi Henderson",group:30,type:"mixed"},
  {name:"Michael Allen",group:30,type:"mixed"},{name:"Marija Atanasovska",group:30,type:"mixed"},
  {name:"Bjorn Ter",group:30,type:"mixed"},{name:"Anita Fierati",group:30,type:"mixed"},
];
 
let state={};
rawData.forEach(p=>{state[p.name]={group:p.group,type:p.type};});
const N=30;
 
function groupType(members){
  const c={gamer:0,chatty:0,mixed:0};
  members.forEach(m=>c[m.type]++);
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function sc(count){return count>=7?'r':count>=5?'y':'g';}
function emoji(count){return count>=7?'🔴':count>=5?'🟡':'🟢';}
function typeLabel(t){return t==='gamer'?'🎲 Gamers':t==='chatty'?'💬 Chatty':'⚡ Mixed';}
 
function buildCard(g){
  const members=Object.entries(state).filter(([,v])=>v.group===g).map(([n,v])=>({name:n,...v}));
  const gt=groupType(members.length?members:[{type:'mixed'}]);
  const s=sc(members.length);
  const card=document.createElement('div');
  card.className=`group-card type-${gt}`;
  card.dataset.group=g;
  card.innerHTML=`
    <div class="group-header">
      <div class="g-num">G${g}</div>
      <div class="g-pill">${typeLabel(gt)}</div>
      <div class="g-count"><span class="sz-dot ${s}"></span>${members.length}/7</div>
    </div>
    <div class="people-area" data-group="${g}"></div>`;
  const area=card.querySelector('.people-area');
  members.forEach(m=>area.appendChild(buildChip(m.name,gt)));
  dropZone(area);
  return card;
}
 
function buildChip(name,gt){
  const c=document.createElement('div');
  c.className='person-chip';c.dataset.name=name;c.draggable=true;
  c.innerHTML=`<div class="p-avatar">${initials(name)}</div><span class="chip-name" title="${name}">${name}</span>`;
  dragSetup(c);
  return c;
}
 
function render(){
  const grid=document.getElementById('groups-grid');
  grid.innerHTML='';
  for(let g=1;g<=N;g++) grid.appendChild(buildCard(g));
  const ua=document.getElementById('un-area');
  ua.innerHTML='';
  const un=Object.entries(state).filter(([,v])=>v.group===0);
  un.forEach(([n,v])=>ua.appendChild(buildChip(n,v.type)));
  document.getElementById('un-count').textContent=un.length?`(${un.length} people)`:'';
  dropZone(ua);
}
 
let dragged=null;
const ghost=document.getElementById('ghost');
 
function dragSetup(chip){
  chip.addEventListener('dragstart',e=>{
    dragged=chip.dataset.name;chip.classList.add('dragging');
    ghost.textContent=chip.dataset.name;ghost.style.display='block';
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setDragImage(new Image(),0,0);
  });
  chip.addEventListener('dragend',()=>{
    chip.classList.remove('dragging');ghost.style.display='none';dragged=null;
    document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  });
}
 
document.addEventListener('dragover',e=>{
  e.preventDefault();
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
});
 
function dropZone(area){
  area.addEventListener('dragover',e=>{
    e.preventDefault();
    area.closest('.group-card,.unassigned-section')?.classList.add('drag-over');
  });
  area.addEventListener('dragleave',e=>{
    if(!area.contains(e.relatedTarget))
      area.closest('.group-card,.unassigned-section')?.classList.remove('drag-over');
  });
  area.addEventListener('drop',e=>{
    e.preventDefault();if(!dragged)return;
    state[dragged].group=parseInt(area.dataset.group);render();
  });
}
 
function openModal(){
  const sel=document.getElementById('inp-group');
  sel.innerHTML='<option value="0">— Unassigned</option>';
  for(let g=1;g<=N;g++){
    const m=Object.values(state).filter(v=>v.group===g);
    sel.innerHTML+=`<option value="${g}">${emoji(m.length)} Group ${g} (${m.length})</option>`;
  }
  document.getElementById('inp-name').value='';
  document.getElementById('inp-type').value='mixed';
  clearErr();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-name').focus(),80);
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function maybeClose(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function clearErr(){document.getElementById('m-err').classList.remove('show');}
 
function submitModal(){
  const name=document.getElementById('inp-name').value.trim();
  const group=parseInt(document.getElementById('inp-group').value);
  const type=document.getElementById('inp-type').value;
  const err=document.getElementById('m-err');
  if(!name){err.textContent='Please enter a name!';err.classList.add('show');return;}
  if(state[name]){err.textContent='This name already exists!';err.classList.add('show');return;}
  state[name]={group,type};closeModal();render();
  const t=group===0
    ?document.getElementById('unassigned-section')
    :document.querySelector('.group-card[data-group="'+group+'"]');
  if(t){
    t.style.transition='box-shadow .2s';
    t.style.boxShadow='0 0 0 2.5px #DCE58A,0 0 20px rgba(220,229,138,.25)';
    setTimeout(()=>{t.style.boxShadow='';},900);
  }
}
 
render();
</script>
</body>
</html>
